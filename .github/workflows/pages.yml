name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Installer le convertisseur Markdown
        run: python -m pip install markdown

      - name: Générer les pages HTML
        run: |
          python << 'PY'
          import html
          import re
          from pathlib import Path

          import markdown

          root = Path(".")
          converter = markdown.Markdown(extensions=["extra", "sane_lists"])

          def render(text):
              converter.reset()
              return converter.convert(text)

          def split_frontmatter(text):
              if text.startswith("---"):
                  parts = text.split("---", 2)
                  if len(parts) == 3:
                      return parts[1], parts[2]
              return "", text

          def field(front, key):
              lines = front.splitlines()
              for index, line in enumerate(lines):
                  if not line.startswith(f"{key}:"):
                      continue
                  value = line.split(":", 1)[1].strip()
                  if value in {">-", ">", "|-", "|"}:
                      chunks = []
                      for follow in lines[index + 1 :]:
                          if follow and not follow.startswith(" "):
                              break
                          chunks.append(follow.strip())
                      return " ".join(chunks).strip()
                  return value.strip("\"'")
              return ""

          def write_page(path, title, body):
              depth = len(path.parent.parts)
              home = "../" * depth + "index.html"
              nav = "" if depth == 0 else f'<p><a href="{home}">Home</a></p>'
              path.write_text(
                  f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>{html.escape(title)}</title>
            <style>
              body {{ font-family: "Segoe UI", sans-serif; line-height: 1.5; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; color: #1c1917; }}
              a {{ color: #0f4c5c; }}
              code {{ font-family: Consolas, ui-monospace, monospace; }}
            </style>
          </head>
          <body>
          {nav}
          {body}
          </body>
          </html>
          """,
                  encoding="utf-8",
              )

          home = root / "index.md"
          write_page(root / "index.html", "AI Dev Environment", render(home.read_text(encoding="utf-8")))

          skills = []
          for skill_md in sorted((root / "ia" / "skills").glob("*/SKILL.md")):
              front, body = split_frontmatter(skill_md.read_text(encoding="utf-8"))
              name = field(front, "name") or skill_md.parent.name
              description = field(front, "description")
              write_page(skill_md.parent / "index.html", name, render(body.lstrip()))
              skills.append((name, description, skill_md.parent.name))

          skill_items = "\n".join(
              f'<li><a href="{html.escape(slug)}/">{html.escape(name)}</a><br>{html.escape(description)}</li>'
              for name, description, slug in skills
          )
          write_page(root / "ia" / "skills" / "index.html", "Skills", f"<h1>Skills</h1>\n<ul>\n{skill_items}\n</ul>")

          talks = []
          for deck in sorted((root / "talks").glob("*/dist/slide-deck.html")):
              talk_dir = deck.parents[1]
              title = talk_dir.name
              source = talk_dir / "slide-deck.md"
              if source.exists():
                  match = re.search(r"^# (.+)$", source.read_text(encoding="utf-8"), re.M)
                  if match:
                      title = match.group(1).strip()
              talks.append((title, f"{talk_dir.name}/dist/slide-deck.html"))

          talk_items = "\n".join(
              f'<li><a href="{html.escape(href)}">{html.escape(title)}</a></li>'
              for title, href in talks
          ) or "<li>No published slide deck.</li>"
          write_page(root / "talks" / "index.html", "Talks", f"<h1>Talks</h1>\n<ul>\n{talk_items}\n</ul>")

          tools = root / "tools"
          tools.mkdir(exist_ok=True)
          write_page(tools / "index.html", "Tools", "<h1>Tools</h1>\n<p>Tools will be published here.</p>")
          PY

      - name: Retirer l'historique Git de l'artefact
        run: rm -rf .git

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
